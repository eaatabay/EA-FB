name: V75 isolated compile
on:
  push:
    branches:
      - test/nl-land-v75-isolated
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Prepare pinned CloudStream plugin
        run: bash scripts/prepare-cloudstream-gradle.sh
      - name: Compile isolated V75
        run: gradle :EA-FB:assembleDebug --no-daemon --stacktrace
