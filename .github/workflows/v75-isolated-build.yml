name: V75 isolated compile
on:
  push:
    branches:
      - test/nl-land-v75-isolated
    paths-ignore:
      - 'dist-v75-test/**'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already has Android SDK installed. setup-android@v3
      # calls obsolete "sdkmanager tools" and fails before Gradle starts.
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK available at $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -40 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Prepare pinned CloudStream plugin
        run: bash scripts/prepare-cloudstream-gradle.sh
      - name: Compile isolated V75 CS3
        run: gradle :EA-FB:make --no-daemon --stacktrace
      - name: Verify V75 CS3 manifest and isolate test artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          cs3 = list(Path("EA-FB/build").glob("*.cs3"))
          assert len(cs3) == 1, f"Expected 1 CS3, found: {cs3}"
          with zipfile.ZipFile(cs3[0]) as z:
              manifest = json.loads(z.read("manifest.json"))
          assert manifest.get("version") == 75, manifest
          target = Path("build/v75-isolated")
          target.mkdir(parents=True, exist_ok=True)
          (target / "EA-FB-V75-NL-LAND-TEST.cs3").write_bytes(cs3[0].read_bytes())
          print("CS3 manifest verified v75, isolated test package prepared")
          PY
      - name: Upload V75 isolated test CS3
        uses: actions/upload-artifact@v4
        with:
          name: EA-FB-V75-NL-LAND-TEST
          path: build/v75-isolated/EA-FB-V75-NL-LAND-TEST.cs3
          if-no-files-found: error
          retention-days: 14

      - name: Publish isolated V75 test repository
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          src=Path("build/v75-isolated/EA-FB-V75-NL-LAND-TEST.cs3")
          assert src.is_file()
          with zipfile.ZipFile(src) as z:
              manifest=json.loads(z.read("manifest.json"))
          assert manifest.get("version")==75, manifest
          root="https://raw.githubusercontent.com/eaatabay/EA-FB/test/nl-land-v75-isolated/dist-v75-test"
          out=Path("dist-v75-test")
          out.mkdir(exist_ok=True)
          (out/"EA-FB-V75-NL-LAND-TEST.cs3").write_bytes(src.read_bytes())
          meta={
              "fileHash":"sha256-"+hashlib.sha256(src.read_bytes()).hexdigest(),
              "apiVersion":1,
              "repositoryUrl":"https://github.com/eaatabay/EA-FB",
              "fileSize":src.stat().st_size,
              "status":3,
              "language":"tr",
              "authors":["EA-FB"],
              "tvTypes":["Movie","TvSeries","Live"],
              "version":75,
              "internalName":"EA-FB",
              "description":"Isolated NL/LAND V75 Mi Box test; V74 untouched",
              "url":root+"/EA-FB-V75-NL-LAND-TEST.cs3",
              "name":"EA-FB V75 NL LAND TEST",
              "iconUrl":"https://raw.githubusercontent.com/eaatabay/EA-FB/main/assets/ea-fb-logo.png"
          }
          (out/"plugins.json").write_text(json.dumps([meta],ensure_ascii=False,indent=2)+"\n")
          (out/"repo.json").write_text(json.dumps({
              "name":"EA-FB V75 NL LAND TEST",
              "description":"Isolated test distribution; does not replace V74",
              "manifestVersion":1,
              "pluginLists":[root+"/plugins.json"]
          },ensure_ascii=False,indent=2)+"\n")
          print("Prepared isolated V75 repository")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist-v75-test/EA-FB-V75-NL-LAND-TEST.cs3 dist-v75-test/plugins.json dist-v75-test/repo.json
          git commit -m "Publish isolated V75 NL LAND test repository [skip ci]"
          git push origin HEAD:test/nl-land-v75-isolated

      - name: Publish V75 to existing RED CloudStream auto-update repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --branch feature/detail-dual-ratings-v6 --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/eafb-v75-red
          python3 - <<'PY'
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          package=Path("build/v75-isolated/EA-FB-V75-NL-LAND-TEST.cs3")
          red=Path("/tmp/eafb-v75-red/dist-v6-staging")
          items=json.loads((red/"plugins.json").read_text())
          assert len(items)==1 and items[0]["internalName"]=="EA-FB",items
          item=items[0]
          assert item["version"] in (74,75), f"Unexpected current red version {item['version']}"
          expected="https://raw.githubusercontent.com/eaatabay/EA-FB/feature/detail-dual-ratings-v6/dist-v6-staging/EA-FB-V6-STAGING.cs3"
          assert item["url"]==expected
          assert json.loads((red/"repo.json").read_text())["pluginLists"]==[
              "https://raw.githubusercontent.com/eaatabay/EA-FB/feature/detail-dual-ratings-v6/dist-v6-staging/plugins.json"]
          current=red/"EA-FB-V6-STAGING.cs3"
          assert current.is_file()
          actual_hash="sha256-"+hashlib.sha256(current.read_bytes()).hexdigest()
          assert item["fileHash"]==actual_hash,"Current red metadata hash mismatch"
          assert item["fileSize"]==current.stat().st_size,"Current red size mismatch"
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read("manifest.json"))
              assert manifest["version"]==75,manifest
              assert {"classes.dex","manifest.json"}<=set(z.namelist())
          if item["version"]==74:
              backup=red/"EA-FB-V74-BACKUP.cs3"
              if backup.exists():
                  assert backup.read_bytes()==current.read_bytes(),"V74 backup differs"
              else:
                  shutil.copyfile(current,backup)
          shutil.copyfile(package,current)
          item["version"]=75
          item["fileSize"]=package.stat().st_size
          item["fileHash"]="sha256-"+hashlib.sha256(package.read_bytes()).hexdigest()
          (red/"plugins.json").write_text(json.dumps(items,ensure_ascii=False,indent=2)+"\n")
          print("V75 prepared at EXISTING red update URL; V74 backup preserved")
          PY
          cd /tmp/eafb-v75-red
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-v6-staging/EA-FB-V6-STAGING.cs3 dist-v6-staging/plugins.json
          if test -f dist-v6-staging/EA-FB-V74-BACKUP.cs3; then
            git add dist-v6-staging/EA-FB-V74-BACKUP.cs3
          fi
          if ! git diff --cached --quiet; then
            git commit -m "release(red): publish V75 to existing Mi Box CloudStream update URL; back up V74"
            git push origin HEAD:feature/detail-dual-ratings-v6
          fi
