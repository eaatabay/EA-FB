# Isolated public CI for EA-FB v6. No deploy, secrets, or D1 writes.
name: EA-FB v6 catalog and watchdog CI
on:
  push:
    branches: [feature/detail-dual-ratings-v6]
    paths:
      - ".github/workflows/v6-catalog-ci.yml"
      - "build.gradle.kts"
      - "EA-FB/src/main/kotlin/com/eafb/**"
      - "core-tests/**"
      - "worker/**"
      - "source-watchdog/**"
      - "scripts/test-v6-catalog-local.sh"
      - "scripts/deploy-v6-staging.sh"
      - "scripts/smoke-v6-staging.sh"
      - "scripts/build-v6-staging-codespace.sh"
      - "scripts/build-codespace.sh"
      - "scripts/stage-release.py"
      - "scripts/prepare-v6-staging-overlay.py"
      - "tests/test_stage_release.py"
      - "source-watchdog/test/v6-staging-android-build.test.mjs"
      - "config/backend.v6-staging.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eafb-v6-catalog-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Worker catalog and ratings tests
        working-directory: worker
        run: npm test
      - name: Verify Kotlin and Java for Android catalog policy tests
        run: |
          java -version
          kotlinc -version
      - name: V6 staging Android build isolation tests
        run: |
          bash -n scripts/build-v6-staging-codespace.sh
          python -m py_compile scripts/prepare-v6-staging-overlay.py
          python -m unittest tests.test_stage_release -q
          node --test source-watchdog/test/v6-staging-android-build.test.mjs
      - name: Android catalog policies (offline JVM)
        run: bash scripts/test-v6-catalog-local.sh
      - name: Install local-only watchdog test tools
        working-directory: source-watchdog
        run: npm install --no-audit --no-fund
      - name: Watchdog local release acceptance
        working-directory: source-watchdog
        env:
          CI: "true"
          NO_D1_WARNING: "true"
          WRANGLER_SEND_METRICS: "false"
        run: npm run test:release-local

  staging-cs3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: catalog-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platform-tools"
      - name: Install Gradle 8.12
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          echo "7a2c66d1e4e31fbc5e4c31f5b5a28e94e7f540f2c4e4d6d6f4f2f32d98e3c2f7  /tmp/gradle.zip" > /tmp/gradle.sha256 || true
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.12/bin" >> "$GITHUB_PATH"
      - name: Build isolated red V6 staging CS3
        env:
          GRADLE_OPTS: "-Xmx512m -XX:MaxMetaspaceSize=256m"
          JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
        run: bash scripts/build-v6-staging-codespace.sh --build
      - name: Upload red V6 staging package
        uses: actions/upload-artifact@v4
        with:
          name: EA-FB-V6-STAGING
          path: |
            build/v6-staging-artifacts/EA-FB-V6-STAGING.cs3
            build/v6-staging-artifacts/plugins.json
            build/v6-staging-artifacts/repo.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish isolated V6 staging web repository
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path('build/v6-staging-artifacts')
          repo = json.loads((base / 'repo.json').read_text())
          plugin = json.loads((base / 'plugins.json').read_text())[0]
          package = base / 'EA-FB-V6-STAGING.cs3'
          assert repo['name'] == 'EA-FB STREAM'
          assert plugin['name'] == 'EA-FB V6 STAGING'
          assert plugin['fileSize'] == package.stat().st_size
          assert plugin['fileHash'] == 'sha256-' + hashlib.sha256(package.read_bytes()).hexdigest()
          print('Validated V6 staging manifests and package hash')
          PY
          mkdir -p dist-v6-staging
          cp build/v6-staging-artifacts/EA-FB-V6-STAGING.cs3 dist-v6-staging/EA-FB-V6-STAGING.cs3
          cp build/v6-staging-artifacts/plugins.json dist-v6-staging/plugins.json
          cp build/v6-staging-artifacts/repo.json dist-v6-staging/repo.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-v6-staging/repo.json dist-v6-staging/plugins.json
          git add -f dist-v6-staging/EA-FB-V6-STAGING.cs3
          if git diff --cached --quiet; then
            echo "Staging web repository already current"
          else
            git commit -m "build(v6): publish staging web repository [skip ci]"
            git fetch origin feature/detail-dual-ratings-v6
            git rebase origin/feature/detail-dual-ratings-v6
            git push origin HEAD:feature/detail-dual-ratings-v6
          fi
