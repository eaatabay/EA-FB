# V42 staging-only deployment. Never deploy production, never expose TMDb secrets. Source-language title route verified by green CI.
name: EA-FB V6 staging deploy
on:
  workflow_dispatch:
  push:
    branches: [feature/detail-dual-ratings-v6]
    paths:
      - ".github/workflows/v6-staging-deploy.yml"
permissions:
  contents: read
concurrency:
  group: ea-fb-v6-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/feature/detail-dual-ratings-v6'
    runs-on: ubuntu-latest
    environment: v6-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check staging-only configuration and Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_V6_STAGING }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_V6_STAGING }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" || {
            echo "::error::Missing V6 staging-only Cloudflare GitHub secrets"; exit 2;
          }
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const prod=JSON.parse(readFileSync('worker/wrangler.jsonc'));
          const stage=JSON.parse(readFileSync('worker/wrangler.staging.jsonc'));
          if (stage.name !== 'ea-fb-catalog-v6-staging' ||
              prod.name === stage.name || 'routes' in stage ||
              'd1_databases' in stage || 'zone_id' in stage ||
              stage.ai?.binding !== 'AI' || 'ai' in prod ||
              'd1_databases' in prod) {
            throw Error('Refusing non-isolated staging configuration');
          }
          const migration=readFileSync('worker/migrations/0001_episode_title_cache.sql','utf8');
          if (!migration.includes('CREATE TABLE IF NOT EXISTS episode_title_cache') ||
              !migration.includes('CREATE TABLE IF NOT EXISTS episode_title_locks')) {
            throw Error('Missing V42 title-cache D1 migration');
          }
          console.log('PASS: staging-only Worker + AI; production remains free of AI/D1');
          JS
      - name: Test V6 Worker
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Provision V42 staging title cache and deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_V6_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_V6_STAGING }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          DB_NAME="ea-fb-title-cache-v6-staging"
          DEPLOY_CONFIG="wrangler.staging.jsonc"

          parse_db_id() {
            node --input-type=module - "$DB_NAME" /tmp/eafb-d1-list.json <<'JS'
          import {readFileSync} from "node:fs";
          const [name,file]=process.argv.slice(2);
          const dbs=JSON.parse(readFileSync(file,"utf8"));
          const db=Array.isArray(dbs) ? dbs.find(x=>x?.name===name) : null;
          if (db) process.stdout.write(String(db.uuid || db.database_id || ""));
          JS
          }

          D1_API_OK="false"
          if npx wrangler d1 list --json > /tmp/eafb-d1-list.json 2>/tmp/eafb-d1-list.err; then
            D1_API_OK="true"
          else
            echo "::warning::Staging Cloudflare token has no D1 API access; V42 will deploy without persistent D1 cache."
            sed -n '1,8p' /tmp/eafb-d1-list.err || true
          fi

          DB_ID=""
          if [ "$D1_API_OK" = "true" ]; then
            DB_ID="$(parse_db_id)"
            if [ -z "$DB_ID" ]; then
              echo "Creating isolated V42 staging D1: $DB_NAME"
              if npx wrangler d1 create "$DB_NAME" --location eeur; then
                for attempt in 1 2 3 4 5; do
                  if npx wrangler d1 list --json > /tmp/eafb-d1-list.json 2>/tmp/eafb-d1-list.err; then
                    DB_ID="$(parse_db_id)"
                    [ -n "$DB_ID" ] && break
                  fi
                  sleep 2
                done
              else
                echo "::warning::Could not create staging D1 with current token; continuing without persistent cache."
              fi
            fi
          fi

          if [ -n "$DB_ID" ]; then
            node --input-type=module - "$DB_NAME" "$DB_ID" <<'JS'
          import {readFileSync,writeFileSync} from "node:fs";
          const [name,id]=process.argv.slice(2);
          const source=JSON.parse(readFileSync("wrangler.staging.jsonc","utf8"));
          if (source.name!=="ea-fb-catalog-v6-staging" || source.ai?.binding!=="AI" ||
              "routes" in source || "d1_databases" in source) {
            throw Error("Refusing to derive runtime config from non-isolated staging source");
          }
          source.d1_databases=[{
            binding:"TITLE_CACHE",
            database_name:name,
            database_id:id,
            migrations_dir:"migrations"
          }];
          writeFileSync("wrangler.staging.runtime.jsonc",JSON.stringify(source,null,2)+"\n");
          JS
            npx wrangler d1 migrations apply "$DB_NAME" --remote --config wrangler.staging.runtime.jsonc
            DEPLOY_CONFIG="wrangler.staging.runtime.jsonc"
            echo "PASS: V42 persistent D1 title cache is bound for staging."
          fi

          npx wrangler deploy --config "$DEPLOY_CONFIG"
      - name: Verify staging health and V42 title localization
        run: |
          STAGING_URL="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('config/backend.v6-staging.json','utf8')); process.stdout.write(c.apiBaseUrl || '')")"
          test -n "$STAGING_URL" || { echo "::error::Missing staging API base URL"; exit 2; }
          EA_FB_V6_STAGING_URL="$STAGING_URL" bash scripts/smoke-v6-staging.sh
