name: GitHub storage safe cleanup 20261020
on:
  push:
    branches:
      - maintenance/actions-storage-cleanup-20261020
    paths:
      - .github/workflows/storage-safe-cleanup-20261020.yml
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inventory and delete only disposable files and caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime,re,sys
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          now=datetime.datetime.now(datetime.timezone.utc)
          def call(path,method="GET"):
              req=urllib.request.Request("https://api.github.com"+path,method=method,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      raw=response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as ex:
                  print("API_ERROR",method,path,ex.code,ex.read().decode("utf8","replace")[:400],flush=True)
                  raise
          def page_all(endpoint,key):
              data=[]
              for p in range(1,101):
                  payload=call(f"/repos/{repo}/{endpoint}?per_page=100&page={p}")
                  chunk=payload.get(key,[])
                  data.extend(chunk)
                  if len(chunk)<100:
                      break
              return data
          def days(t):
              if not t:return 99999
              return (now-datetime.datetime.fromisoformat(t.replace("Z","+00:00"))).total_seconds()/86400
          artifacts=page_all("actions/artifacts","artifacts")
          caches=page_all("actions/caches","actions_caches")
          total_art=sum(x.get("size_in_bytes",0) for x in artifacts)
          total_cache=sum(x.get("size_in_bytes",0) for x in caches)
          print("INVENTORY",repo,"artifacts",len(artifacts),"artifact_bytes",total_art,"caches",len(caches),"cache_bytes",total_cache,flush=True)
          for x in sorted(artifacts,key=lambda x:x.get("size_in_bytes",0),reverse=True)[:20]:
              print("LARGEST_ARTIFACT",x["id"],x["name"],x.get("size_in_bytes"),x.get("created_at"),flush=True)
          for x in sorted(caches,key=lambda x:x.get("size_in_bytes",0),reverse=True)[:15]:
              print("LARGEST_CACHE",x["id"],x["key"],x.get("size_in_bytes"),x.get("last_accessed_at"),flush=True)
          protected=re.compile(r"v83|v81|v5|8503|8601|stable|release|production|backup|archive|snapshot|sqlite|database|manifest|drive|main|publish",re.I)
          disposable=re.compile(r"logs?$|diagnostic|debug|(^EA-FB-.*-TEST$)|^EA-FB-CODEX-",re.I)
          selected=[]
          for a in artifacts:
              name=a.get("name","")
              age=days(a.get("created_at"))
              if a.get("expired") or (disposable.search(name) and not protected.search(name) and age>=5):
                  selected.append(a)
          deleted_art=0
          freed_art=0
          for a in selected:
              call(f"/repos/{repo}/actions/artifacts/{a['id']}","DELETE")
              deleted_art+=1
              freed_art+=a.get("size_in_bytes",0)
              print("DELETED_DISPOSABLE_ARTIFACT",a["id"],a["name"],a.get("size_in_bytes"),flush=True)
          deleted_cache=0
          freed_cache=0
          for c in caches:
              key=c.get("key","")
              if days(c.get("last_accessed_at"))<2:
                  continue
              if re.search(r"sqlite|database|backup|archive|source|history|master|race|horse|tjk",key,re.I):
                  continue
              call(f"/repos/{repo}/actions/caches/{c['id']}","DELETE")
              deleted_cache+=1
              freed_cache+=c.get("size_in_bytes",0)
              print("DELETED_RECREATABLE_CACHE",c["id"],key,c.get("size_in_bytes"),flush=True)
          print("CLEANUP_FINISHED",repo,"removed_artifacts",deleted_art,"artifact_bytes",freed_art,"removed_caches",deleted_cache,"cache_bytes",freed_cache,flush=True)
          PY
