# Manual isolated build for the red EA-FB V6 staging plugin.
# Never deploys Worker/D1 and never publishes to production dist/release.
name: EA-FB V6 staging CS3 build

on:
  workflow_dispatch:
  push:
    branches:
      - test/dizibox-king-mibox

permissions:
  contents: write

concurrency:
  group: eafb-v6-staging-cs3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/dizibox-king-mibox
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install compatible Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"

      - name: Install Android SDK API 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 platform-tools"

      - name: Check Android SDK installation
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "PASS: Android API 35 available at $ANDROID_HOME"

      - name: Build isolated red V6 package
        env:
          GRADLE_OPTS: "-Xmx512m -XX:MaxMetaspaceSize=256m"
          JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
        run: bash scripts/build-v6-staging-codespace.sh --build

      - name: Verify artifact is a CS3 ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path("build/v6-staging-artifacts/EA-FB-V6-STAGING.cs3")
          assert p.is_file() and zipfile.is_zipfile(p)
          with zipfile.ZipFile(p) as archive:
              names=set(archive.namelist())
              assert {"classes.dex", "manifest.json"} <= names, names
              assert archive.testzip() is None, "Corrupt CS3 ZIP member"
          print("PASS: verified CS3 dex, manifest and ZIP integrity", p, p.stat().st_size)
          PY

      - name: Upload red V6 CS3
        uses: actions/upload-artifact@v4
        with:
          name: EA-FB-V6-STAGING
          path: build/v6-staging-artifacts/EA-FB-V6-STAGING.cs3
          if-no-files-found: error
          retention-days: 7

      - name: Publish V56 to existing red staging repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch feature/detail-dual-ratings-v6 --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/eafb-red-publish
          python3 - <<'PY'
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          package=Path("build/v6-staging-artifacts/EA-FB-V6-STAGING.cs3")
          target=Path("/tmp/eafb-red-publish/dist-v6-staging")
          old=json.JSONDecoder().raw_decode((target/"plugins.json").read_text())[0]
          assert len(old)==1 and old[0]["internalName"]=="EA-FB"
          assert old[0]["version"]<56, "Refusing to overwrite an equal or newer red release"
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              m=json.loads(z.read("manifest.json"))
              assert m.get("version")==56, m
          target.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(package,target/"EA-FB-V6-STAGING.cs3")
          item=old[0]
          item["version"]=56
          item["fileSize"]=package.stat().st_size
          item["fileHash"]="sha256-"+hashlib.sha256(package.read_bytes()).hexdigest()
          item["url"]="https://raw.githubusercontent.com/eaatabay/EA-FB/feature/detail-dual-ratings-v6/dist-v6-staging/EA-FB-V6-STAGING.cs3"
          (target/"plugins.json").write_text(json.dumps(old,ensure_ascii=False,indent=2)+"\n")
          repo=json.loads((target/"repo.json").read_text())
          assert repo["pluginLists"]==["https://raw.githubusercontent.com/eaatabay/EA-FB/feature/detail-dual-ratings-v6/dist-v6-staging/plugins.json"]
          print("PASS: V56 package and manifest staged at existing red update URL")
          PY
          cd /tmp/eafb-red-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-v6-staging/EA-FB-V6-STAGING.cs3 dist-v6-staging/plugins.json
          git diff --cached --quiet && { echo "Nothing to publish"; exit 1; }
          git commit -m "release(red): publish V56 test CS3 for existing Mi Box auto-update"
          git push origin HEAD:feature/detail-dual-ratings-v6
